<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Restipay — Kafe va restoran boshqaruv dasturi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="page-style"></style>
<style>
:root{
  --bg:#f3f4f6;--panel:#fff;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--faint:#94a3b8;
  --line:#e5e7eb;--soft:#f8fafc;
  --brand:#f97316;--brand2:#ea580c;--brandSoft:#fff7ed;
  --green:#10b981;--green2:#047857;--greenSoft:#ecfdf5;
  --amber:#f59e0b;--amber2:#b45309;--amberSoft:#fffbeb;
  --red:#ef4444;--red2:#b91c1c;--redSoft:#fef2f2;
  --blue:#3b82f6;--blueSoft:#eff6ff;
  --side:#0b1220;--r:18px;
  --sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px -6px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
input,textarea{user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.ic{flex-shrink:0;display:block}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

/* ===== LAYOUT ===== */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;height:100dvh}
.side{background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;padding:18px 12px;gap:6px;min-height:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 18px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:8px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#fb923c,#ea580c);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px -8px rgba(249,115,22,.7);flex-shrink:0}
.brand b{color:#fff;font-size:18px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.brand b span{color:#fb923c}
.brand small{font-size:11px;color:#64748b;font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:13px;font-size:14px;font-weight:600;color:#94a3b8;position:relative;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.nav button.on{background:linear-gradient(90deg,rgba(249,115,22,.22),rgba(249,115,22,.06));color:#fff}
.nav button.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.nav button.on .ic{color:#fb923c}
.bdg{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.bdg[hidden]{display:none}
.shift{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.ava{width:36px;height:36px;border-radius:50%;background:rgba(16,185,129,.15);color:#34d399;display:grid;place-items:center;font-weight:800;font-size:13px;border:1px solid rgba(16,185,129,.35);flex-shrink:0}
.shift p{font-size:12.5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift span{font-size:11px;color:#34d399;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.live{animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.35}}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.top p{font-size:12.5px;color:var(--muted);margin-top:2px}
.top-r{display:flex;align-items:center;gap:12px}
.rev{display:flex;align-items:center;gap:10px;background:var(--greenSoft);border:1px solid #a7f3d0;padding:8px 14px;border-radius:14px}
.rev small{font-size:11px;color:var(--green2);font-weight:600;display:block}
.rev b{font-size:15px;font-weight:800;color:#065f46}
.clock{text-align:right;padding-left:12px;border-left:1px solid var(--line)}
.clock b{font-size:18px;font-weight:800;display:block;letter-spacing:-.02em}
.clock small{font-size:11px;color:var(--faint)}
.view{flex:1;overflow:auto;padding:24px 26px 40px;min-height:0}
.view[hidden]{display:none}

/* ===== COMMON ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;height:46px;border-radius:13px;font-weight:700;font-size:14px;transition:transform .08s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#1e293b}
.btn-brand{background:var(--brand);color:#fff;box-shadow:0 8px 18px -8px rgba(249,115,22,.8)}.btn-brand:hover{background:var(--brand2)}
.btn-green{background:var(--green);color:#fff;box-shadow:0 8px 18px -8px rgba(16,185,129,.8)}.btn-green:hover{background:#059669}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}.btn-ghost:hover{background:var(--soft)}
.btn-soft{background:var(--soft);border:1px solid var(--line);color:var(--ink2)}
.btn-danger{background:var(--redSoft);color:var(--red2);border:1px solid #fecaca}
.btn-sm{height:38px;padding:0 13px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:42px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{font-style:normal;font-size:11px;font-weight:800;background:rgba(100,116,139,.12);padding:2px 7px;border-radius:8px}
.chip.on i{background:rgba(255,255,255,.18)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}
.sec-h h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--faint);font-size:13px}
.empty .ic{margin:0 auto 10px;opacity:.5}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font-size:14px;outline:none;transition:border .15s,box-shadow .15s}
textarea.inp{height:auto;padding:10px 14px;resize:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(249,115,22,.15)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{height:38px;padding:0 16px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.sw{width:46px;height:28px;border-radius:14px;background:#cbd5e1;position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--green)}.sw.on::after{left:21px}

/* ===== TABLES ===== */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.sum{padding:16px 18px;display:flex;align-items:center;gap:14px}
.sum .si{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;font-weight:800}
.sum small{font-size:12px;color:var(--muted);font-weight:600;display:block}
.sum b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:16px}
.tcard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:184px;position:relative;overflow:hidden;box-shadow:var(--sh);transition:transform .12s,box-shadow .15s,border-color .15s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(15,23,42,.18)}
.tcard:active{transform:scale(.985)}
.tcard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--green)}
.tcard.busy{background:linear-gradient(180deg,#fffbeb 0,#fff 60%);border-color:#fde68a}.tcard.busy::before{background:var(--amber)}
.tcard.bill{background:linear-gradient(180deg,#fef2f2 0,#fff 60%);border-color:#fca5a5;animation:ring 2s infinite}.tcard.bill::before{background:var(--red)}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.0),var(--sh)}50%{box-shadow:0 0 0 5px rgba(239,68,68,.18),var(--sh)}}
.tc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tc-name{font-size:19px;font-weight:800;letter-spacing:-.02em}
.tc-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:3px}
.pill{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.p-free{background:var(--greenSoft);color:var(--green2)}
.p-busy{background:var(--amber);color:#451a03}
.p-bill{background:var(--red);color:#fff}
.tc-flags{display:flex;gap:6px;flex-wrap:wrap;min-height:24px}
.flag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
.f-time{background:rgba(15,23,42,.06);color:var(--ink2)}
.f-ready{background:var(--greenSoft);color:var(--green2)}
.f-new{background:var(--blueSoft);color:#1d4ed8}
.tc-bot{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:flex-end;justify-content:space-between}
.tc-bot small{font-size:11.5px;color:var(--muted);display:block}
.tc-bot b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.go{width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center}
.go.add{background:var(--greenSoft);color:var(--green2)}
.newcard{border:2px dashed #cbd5e1;background:transparent;box-shadow:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.newcard::before{display:none}
.newcard .nci{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--ink)}

/* ===== POS ===== */
.pos{display:grid;grid-template-columns:1fr 410px;padding:0!important;overflow:hidden!important}
.pos-l{display:flex;flex-direction:column;min-height:0;min-width:0}
.pos-head{padding:18px 22px 12px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.search{position:relative}
.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:44px;height:50px;font-size:15px;border-radius:14px}
.mgrid{flex:1;overflow:auto;padding:4px 22px 110px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;align-content:start}
.mi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;position:relative;box-shadow:var(--sh);transition:transform .08s,border-color .15s;min-height:150px}
.mi:hover{border-color:#fdba74}
.mi:active{transform:scale(.97)}
.mi .em{width:54px;height:54px;border-radius:15px;background:var(--brandSoft);display:grid;place-items:center;font-size:30px}
.mi .nm{font-size:14px;font-weight:700;line-height:1.3;color:var(--ink)}
.mi .pr{font-size:15px;font-weight:800;color:var(--brand2);margin-top:auto}
.mi .q{position:absolute;top:12px;right:12px;min-width:30px;height:30px;padding:0 8px;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(249,115,22,.9)}
.mi.off{opacity:.5;pointer-events:none;background:repeating-linear-gradient(135deg,#fff 0 10px,#f8fafc 10px 20px)}
.mi.off .pr{color:var(--red2)}
.cart{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-shadow:-10px 0 30px -20px rgba(15,23,42,.25)}
.cart-h{padding:16px 18px;background:var(--side);color:#fff;display:flex;align-items:center;gap:12px}
.cart-h .tb{width:46px;height:46px;border-radius:14px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.cart-h h3{font-size:16px;font-weight:800}
.cart-h p{font-size:12px;color:#94a3b8;margin-top:2px}
.cart-h .x{margin-left:auto;display:flex;gap:6px}
.hbtn{height:36px;padding:0 11px;border-radius:10px;background:rgba(255,255,255,.08);color:#e2e8f0;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.hbtn:hover{background:rgba(255,255,255,.14)}
.cart-sub{padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--ink2)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:32px;height:32px;border-radius:9px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center}
.step b{min-width:26px;text-align:center}
.cart-list{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.ci{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:10px}
.ci-i{flex:1;min-width:0}
.ci-n{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-s{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px}
.t-sent{background:var(--greenSoft);color:var(--green2)}
.t-new{background:var(--blueSoft);color:#1d4ed8}
.qty{display:flex;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px}
.qty button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}
.qty button:hover{background:#fff}
.qty b{min-width:26px;text-align:center;font-size:14px}
.ci-sum{width:78px;text-align:right;font-weight:800;font-size:13.5px}
.cart-f{padding:14px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px;background:#fff}
.note{font-size:13px}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.trow b{color:var(--ink2);font-weight:700}
.trow.big{padding-top:10px;border-top:1px dashed var(--line);color:var(--ink);font-size:14px;font-weight:800}
.trow.big b{font-size:24px;color:var(--brand2);font-weight:800;letter-spacing:-.02em}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.acts .btn{height:54px;font-size:15px}
.cart-fab{display:none}
.sheet-bg{display:none}

/* ===== REPORTS ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:18px}
.kpi-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kpi-h span{font-size:12.5px;font-weight:700;color:var(--muted)}
.kpi-i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.kpi b{font-size:25px;font-weight:800;letter-spacing:-.03em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi p{font-size:12px;color:var(--muted);margin-top:4px}
.rgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.rgrid3{display:grid;grid-template-columns:1fr 2fr;gap:16px;margin-top:16px}
.pad{padding:20px}
.ch-t{font-size:14.5px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.ch-t small{font-size:12px;color:var(--muted);font-weight:600}
.hours{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.hb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.hb .bar{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#fb923c,#f97316);min-height:3px;position:relative}
.hb .bar.z{background:#e5e7eb}
.hb .bar:hover::after{content:attr(data-v);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:4px 7px;border-radius:7px;white-space:nowrap}
.hb small{font-size:10.5px;color:var(--faint);font-weight:600}
.bars{display:flex;flex-direction:column;gap:14px}
.br-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.br-h span:last-child{color:var(--muted)}
.br-h b{color:var(--ink)}
.track{height:10px;border-radius:6px;background:#f1f5f9;overflow:hidden}
.track div{height:100%;border-radius:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid #f1f5f9}
.tbl tr:hover td{background:var(--soft)}
.tbl .r{text-align:right}
.mtag{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px;background:#f1f5f9;color:var(--ink2);white-space:nowrap}
.top5{display:flex;flex-direction:column;gap:10px}
.t5{display:flex;align-items:center;gap:12px;font-size:13px}
.t5 .rk{width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--muted)}
.t5:first-child .rk{background:var(--brandSoft);color:var(--brand2)}
.t5 .em{font-size:22px}
.t5 .n{flex:1;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t5 .v{text-align:right;font-weight:800}
.t5 .v small{display:block;font-size:11px;color:var(--muted);font-weight:600}

/* ===== MENU ADMIN ===== */
.madm{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start;max-width:1200px}
.form{padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.form h3{font-size:16px;font-weight:800}
.form p{font-size:12.5px;color:var(--muted);margin-top:-8px}
.emj{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emj button{height:38px;border-radius:10px;font-size:20px;background:var(--soft);border:1px solid var(--line)}
.emj button.on{background:var(--brandSoft);border-color:var(--brand);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f1f5f9}
.mrow:last-child{border-bottom:0}
.mrow .em{width:44px;height:44px;border-radius:13px;background:var(--brandSoft);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.mrow .i{flex:1;min-width:0}
.mrow .i b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .i small{font-size:12px;color:var(--muted)}
.mrow .p{font-weight:800;font-size:14px;width:110px;text-align:right}
.mrow.off .em,.mrow.off .i,.mrow.off .p{opacity:.45}
.ibtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--soft);color:var(--ink)}
.ibtn.del:hover{background:var(--redSoft);color:var(--red2)}
.cat-h{padding:12px 16px;background:var(--soft);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.sl{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}

/* ===== SETTINGS ===== */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1200px;align-items:start}
.sgrid .card{padding:22px;display:flex;flex-direction:column;gap:16px}
.sgrid h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0}
.srow b{font-size:13.5px;font-weight:700;display:block}
.srow small{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.guide{display:flex;flex-direction:column;gap:12px}
.gi{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.gi .n{width:30px;height:30px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.gi>div>b{font-size:13.5px;display:block;margin-bottom:3px}.gi p b{color:var(--ink2)}
.gi p{font-size:12.5px;color:var(--muted);line-height:1.5}
.tip{padding:14px;border-radius:14px;background:var(--brandSoft);border:1px solid #fed7aa;font-size:12.5px;color:#7c2d12;line-height:1.55}
.tip b{color:#7c2d12}
code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:rgba(15,23,42,.06);padding:2px 6px;border-radius:6px;user-select:all}

/* ===== MODAL ===== */
.modal{position:fixed;inset:0;background:rgba(2,6,23,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:95;padding:16px}
.modal.show{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dlg{background:#fff;border-radius:26px;width:100%;max-height:94vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .18s}
@keyframes pop{from{transform:translateY(10px) scale(.98)}}
.dlg-h{padding:18px 22px;background:var(--side);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dlg-h h3{font-size:17px;font-weight:800}
.dlg-h p{font-size:12.5px;color:#94a3b8;margin-top:2px}
.xbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#cbd5e1}
.co{display:grid;grid-template-columns:auto 1fr;min-height:0;overflow:auto}
.co-l{background:#e9ecf1;padding:22px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
.co-r{padding:22px;display:flex;flex-direction:column;gap:18px}
.co-r h5{font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.pm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pm button{height:72px;border-radius:14px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.pm button span{font-size:22px}
.pm button.on{border-color:var(--green);background:var(--greenSoft);color:#065f46;box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.disc{display:flex;gap:6px;flex-wrap:wrap}
.disc button{height:40px;min-width:56px;padding:0 12px;border-radius:11px;border:1px solid var(--line);font-weight:700;font-size:13px}
.disc button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cash{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{height:36px;padding:0 10px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:700}
.change{height:46px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--greenSoft);color:#065f46;font-weight:800}
.change.bad{background:var(--redSoft);color:var(--red2)}
.grand{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--ink);color:#fff}
.grand span{font-size:13px;color:#94a3b8;font-weight:600}
.grand b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.warnbox{padding:10px 12px;border-radius:12px;background:var(--amberSoft);border:1px solid #fde68a;color:#78350f;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.co-acts{display:flex;gap:10px;margin-top:auto}
.co-acts .btn{height:56px}
.mini-list{display:flex;flex-direction:column;gap:8px;padding:20px;max-height:60vh;overflow:auto}
.mini-list button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--line);font-weight:700;font-size:14px}
.mini-list button:hover{border-color:var(--green);background:var(--greenSoft)}

/* ===== PAPER / RECEIPT ===== */
.paper{background:#fff;box-shadow:0 10px 30px -10px rgba(15,23,42,.3);padding:14px 12px 22px;position:relative;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.paper.w80{width:302px}.paper.w58{width:219px}
.rc{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;color:#000;font-size:12px;line-height:1.45}
.rc.rc58{font-size:10.5px}
.rc .c{text-align:center}
.rc .b{font-weight:800}
.rc .big{font-size:1.25em;text-transform:uppercase;letter-spacing:.02em}
.rc .xl{font-size:1.9em;font-weight:800;line-height:1.2;margin:2px 0}
.rc .row{display:flex;justify-content:space-between;gap:8px}
.rc .row span:last-child{text-align:right;white-space:nowrap}
.rc .hr{border-top:1px dashed #000;margin:7px 0}
.rc .rl{margin-bottom:4px}
.rc .rn{font-weight:700}
.rc .tot{font-weight:800;font-size:1.3em;margin:4px 0}
.rc .ki{font-size:1.35em;font-weight:700;padding:3px 0;line-height:1.3}
.rc .ki b{font-size:1.1em}
.rc .stamp{border:2px solid #000;text-align:center;font-weight:800;padding:3px;margin:6px 0;letter-spacing:.1em}
#print-area{display:none}

/* ===== TOAST ===== */
.toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:13px 16px;border-radius:14px;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);border-left:4px solid var(--green);animation:tin .2s;max-width:360px}
.toast.warn{border-left-color:var(--amber)}.toast.err{border-left-color:var(--red)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ===== RESPONSIVE ===== */
@media (max-width:1280px){.summary,.kpis{grid-template-columns:repeat(2,1fr)}.rgrid,.rgrid3{grid-template-columns:1fr}}
@media (max-width:1180px){
  .app{grid-template-columns:84px 1fr}
  .lbl,.brand .bt,.shift .st{display:none}
  .brand{justify-content:center;padding:2px 0 16px}
  .nav button{justify-content:center}
  .nav button.on::before{left:-12px}
  .bdg{position:absolute;top:5px;right:8px;margin:0;min-width:20px;height:20px;font-size:10px}
  .shift{justify-content:center;padding:10px 0}
  .pos{grid-template-columns:1fr 370px}
  .madm,.sgrid{grid-template-columns:1fr}
  .form{position:static}
  }
@media (max-width:980px){
  .pos{grid-template-columns:1fr}
  .cart{position:fixed;left:0;right:0;bottom:0;height:88dvh;transform:translateY(105%);transition:transform .25s ease;z-index:45;border-radius:22px 22px 0 0;overflow:hidden;border:0}
  .cart.open{transform:none}
  .sheet-bg{position:fixed;inset:0;background:rgba(2,6,23,.45);z-index:44}
  .sheet-bg.show{display:block}
  .cart-fab{position:fixed;left:16px;right:16px;bottom:16px;z-index:40;height:60px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 18px;box-shadow:0 18px 40px -12px rgba(15,23,42,.6);font-weight:700}
  .cart-fab[hidden]{display:none}
  .cart-fab .fb{background:var(--brand);height:42px;padding:0 16px;border-radius:13px;display:flex;align-items:center;gap:8px;font-weight:800}
  .co{grid-template-columns:1fr}
  .co-l{padding:16px}
}
@media (max-width:760px){
  body{overflow:hidden}
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{order:2;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #1e293b}
  .brand,.shift{display:none}
  .nav{flex-direction:row;justify-content:space-around;gap:2px}
  .nav button{flex-direction:column;gap:4px;padding:8px 4px;font-size:10px;flex:1}
  .nav button .lbl{display:block}
  .nav button.on::before{display:none}
  .bdg{top:2px;right:calc(50% - 22px)}
  .top{padding:12px 16px}
  .top h1{font-size:17px}.top p,.clock{display:none}
  .rev{padding:6px 10px}.rev small{display:none}
  .view{padding:16px 14px 30px}
  .pos-head{padding:14px 14px 10px}
  .mgrid{padding:4px 14px 100px;grid-template-columns:repeat(2,1fr);gap:10px}
  .cart-fab{bottom:calc(78px + env(safe-area-inset-bottom))}
  .tgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .tcard{min-height:160px;padding:13px}
  .tc-name{font-size:16px}
  .summary{gap:10px}
  .sum{padding:12px}.sum b{font-size:18px}.sum .si{width:38px;height:38px}
  .pm{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .hide-m{display:none}
  .toasts{left:14px;right:14px;bottom:90px}
}

@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .app,.modal,.toasts,.cart-fab,.sheet-bg{display:none!important}
  #print-area{display:block}
  #print-area .rc{padding:0 1mm}
}

/* ===== v3: STAFF / GATE / LOCK ===== */
.wchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink2);background:rgba(15,23,42,.05);padding:3px 9px 3px 3px;border-radius:999px;white-space:nowrap}
.wchip i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:9.5px;font-weight:800}
.tcard.dirty{background:linear-gradient(180deg,#eff6ff 0,#fff 60%);border-color:#bfdbfe}.tcard.dirty::before{background:var(--blue)}
.p-dirty{background:var(--blue);color:#fff}
.tcard.other{opacity:.72}
.em img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.mi .em{overflow:hidden}
.mi.has-img .em{width:100%;height:96px;border-radius:13px}
.wsel{height:36px;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;border:0;padding:0 8px;font-size:12px;font-weight:700;max-width:130px}
.wsel option{color:#0f172a}
.cart-sub .who{display:flex;align-items:center;gap:8px}

.gate{position:fixed;inset:0;z-index:90;background:radial-gradient(1000px 520px at 85% -10%,rgba(249,115,22,.22),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgba(59,130,246,.14),transparent 60%),#0b1220;color:#e2e8f0;display:none;overflow:auto}
.gate.show{display:flex}
.gate-in{margin:auto;width:100%;max-width:1060px;padding:32px 20px;display:grid;grid-template-columns:1fr 460px;gap:48px;align-items:center}
.g-brand h1{font-size:42px;font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1.08;margin:20px 0 14px}
.g-brand h1 span{color:#fb923c}
.g-brand>p{color:#94a3b8;font-size:15.5px;line-height:1.6;max-width:460px}
.g-feat{margin-top:26px;display:grid;gap:12px}
.g-feat div{display:flex;gap:12px;align-items:center;font-size:14.5px;color:#cbd5e1;font-weight:500}
.g-feat b{width:34px;height:34px;border-radius:11px;background:rgba(249,115,22,.14);color:#fb923c;display:grid;place-items:center;flex-shrink:0}
.g-card{background:#fff;color:var(--ink);border-radius:26px;padding:26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:14px}
.g-card h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.g-card .sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.g-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px}
.g-tabs button{height:42px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.g-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plans button{border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.plans button b{display:block;font-size:13.5px}
.plans button small{font-size:11.5px;color:var(--brand2);font-weight:800}
.plans button.on{border-color:var(--brand);background:var(--brandSoft);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
.g-err{font-size:13px;color:var(--red2);font-weight:600;min-height:0}
.g-err:empty{display:none}
.g-foot{font-size:12.5px;color:var(--muted);text-align:center}
.g-center{margin:auto;max-width:500px;width:100%;padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.g-ic{width:88px;height:88px;border-radius:28px;display:grid;place-items:center}
.g-center h2{font-size:27px;font-weight:800;color:#fff;letter-spacing:-.02em}
.g-center p{color:#94a3b8;font-size:14.5px;line-height:1.65}
.g-phone{font-size:30px;font-weight:800;color:#fff;letter-spacing:.01em;padding:14px 24px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-decoration:none;display:block;user-select:all}
.g-meta{font-size:12.5px;color:#64748b;line-height:1.7}
.g-meta b{color:#94a3b8}

.lock{flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.lk-top{text-align:center}
.lk-top .logo{margin:0 auto 14px;width:56px;height:56px;border-radius:17px}
.lk-top h2{font-size:21px;font-weight:800;color:#fff}
.lk-top p{color:#94a3b8;font-size:13.5px;margin-top:4px}
.lk-clock{font-size:15px;font-weight:700;color:#64748b;margin-top:6px}
.dots{display:flex;gap:14px;height:20px;align-items:center}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid #475569;transition:.12s}
.dots i.f{background:#fb923c;border-color:#fb923c;transform:scale(1.08)}
.dots.err i{border-color:#f87171;background:transparent}
.dots.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.keys{display:grid;grid-template-columns:repeat(3,84px);gap:14px}
.keys button{height:84px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#fff;font-size:28px;font-weight:600;transition:background .1s}
.keys button:active{background:rgba(249,115,22,.4)}
.keys .k-fn{background:transparent;border:0;font-size:13px;color:#94a3b8;font-weight:700}
.lk-msg{min-height:20px;font-size:13px;color:#f87171;font-weight:700}
.lk-hint{font-size:12px;color:#475569;text-align:center;line-height:1.6}

.banner{padding:9px 26px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
.banner:empty{display:none}
.banner.warn{background:#fffbeb;color:#92400e;border-bottom:1px solid #fde68a}
.banner.info{background:#eff6ff;color:#1e40af;border-bottom:1px solid #bfdbfe}
.banner.demo{background:#f5f3ff;color:#5b21b6;border-bottom:1px solid #ddd6fe}
.netchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:10px;background:var(--soft);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.netchip.on{color:var(--green2)}.netchip.off{color:var(--red2)}
.shift{cursor:pointer;transition:background .15s}
.shift:hover{background:rgba(255,255,255,.08)}
.shift .lockbtn{margin-left:auto;color:#64748b}

.lead{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.ld{padding:16px;display:flex;gap:12px;align-items:center}

.ld small{font-size:12px;color:var(--muted);font-weight:600;display:block}
.ld b{font-size:16px;font-weight:800;display:block}
.ld span{font-size:12px;color:var(--muted)}
.srole{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--soft);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.pin{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:15px;letter-spacing:.22em;background:var(--soft);border:1px dashed #cbd5e1;padding:5px 10px;border-radius:9px;user-select:all}
.srow2{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f1f5f9}
.srow2:last-child{border-bottom:0}
.srow2 .av{width:42px;height:42px;border-radius:13px;font-size:14px}
.srow2 .i{flex:1;min-width:0}
.srow2 .i b{font-size:14px;display:block}
.srow2.off .av,.srow2.off .i{opacity:.45}
.feed{display:flex;flex-direction:column;max-height:520px;overflow:auto}
.fe{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid #f1f5f9;font-size:13px}
.fe .fi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex-shrink:0;background:var(--soft)}
.fe .ft{flex:1;min-width:0}
.fe .ft small{color:var(--muted);font-size:11.5px;display:block}
.fe time{font-size:12px;color:var(--faint);font-weight:700}
.tbl .best td{background:#fffbeb}
.tbl td .z{color:var(--faint)}
.imgbox{border:2px dashed #cbd5e1;border-radius:14px;padding:12px;display:flex;gap:14px;align-items:center;cursor:pointer;background:var(--soft);position:relative}

.imgbox b{font-size:13.5px;display:block}.imgbox small{font-size:12px;color:var(--muted)}

.licbox small{font-size:11.5px;color:var(--muted);font-weight:600;display:block}
.licbox b{font-size:14px}
.st-ok{color:var(--green2)}.st-bad{color:var(--red2)}.st-warn{color:var(--amber2)}
@media (max-width:900px){.gate-in{grid-template-columns:1fr}.g-brand{display:none}.lead{grid-template-columns:1fr}.keys{grid-template-columns:repeat(3,74px)}.keys button{height:74px}}
@media (max-width:760px){.netchip{display:none}.banner{padding:8px 14px}}

.nav button[hidden]{display:none!important}

.toasts{top:86px;bottom:auto}

      </div>
      <div class="cart" id="cart"></div>
      <button class="cart-fab" id="cart-fab" onclick="toggleSheet(true)" hidden></button>

    <section class="view" id="v-me" hidden></section>
    <section class="view" id="v-reports" hidden></section>
    <section class="view" id="v-staff" hidden></section>
    <section class="view" id="v-menu" hidden></section>
    <section class="view" id="v-settings" hidden></section>
  </main>
</div>

/* ================== CRYPTO ================== */
const hasSubtle=()=>!!(window.crypto&&crypto.subtle);
function fnv(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
async function sha(s){if(!hasSubtle())return'f'+fnv(s)+fnv(s+'#');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const localPinHash=p=>sha('gp-local|'+p);
const serverPinHash=(phone,p)=>sha('gp|'+normPhone(phone)+'|'+p);
const b64buf=b=>{const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
let licCache={s:null,p:null};
async function verifyLic(lic){
  if(!lic||!lic.p||!lic.s)return null;
  if(licCache.s===lic.s&&licCache.pp===lic.p)return licCache.p;
  try{
    const key=await crypto.subtle.importKey('spki',b64buf(CONFIG.PUBLIC_KEY),{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['verify']);
    const ok=await crypto.subtle.verify('RSASSA-PKCS1-v1_5',key,b64buf(lic.s),new TextEncoder().encode(lic.p));
    if(!ok)return null;
    const p=JSON.parse(new TextDecoder().decode(b64buf(lic.p)));
    licCache={s:lic.s,pp:lic.p,p};return p;
  }catch(e){return null}
}

/* ================== LITSENZIYA / GATE ================== */
const serverMode=()=>!!CONFIG.SERVER_URL;
async function gateState(){
  if(!serverMode())return{st:'demo'};
  if(!hasSubtle())return{st:'insecure'};
  if(!SEC.cid||!SEC.lic)return{st:'onboard'};
  const p=await verifyLic(SEC.lic);
  if(!p||p.cid!==SEC.cid)return{st:'onboard',err:'Litsenziya yaroqsiz. Qayta kiring.'};
  LIC=p;
  const now=Date.now();
  if(now<SEC.maxSeen-10*60000)return{st:'clock'};               // soat orqaga surilgan
  const eff=Math.max(now,SEC.maxSeen,p.iat||0);
  if(p.st==='blocked')return{st:'blocked'};
  if(p.st==='pending')return{st:'pending'};
  if(!p.exp||eff>p.exp)return{st:'expired'};
  return{st:'ok',daysLeft:Math.ceil((p.exp-eff)/864e5)};
}

function drawDots(err){const d=$('dots');if(!d)return;const n=Math.max(maxPin(),pinBuf.length);d.className='dots'+(err?' err':'');d.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}
function pinKey(k){
  if(Date.now()<lockUntil||pinBusy)return;
  if(k==='del'){pinBuf=pinBuf.slice(0,-1);return drawDots()}
  if(k==='clr'){pinBuf='';return drawDots()}
  if(pinBuf.length>=6)return;
  pinBuf+=k;drawDots();tryPin();
}
async function tryPin(){
  const p=pinBuf,a=adminRec();let user=null;pinBusy=true;
  try{
    if(p.length===4)user=S.staff.find(s=>s.active&&s.role!=='admin'&&s.pin===p)||null;
    if(!user&&a&&p.length===a.pinLen&&await localPinHash(p)===a.pinHash)user=a;
  }finally{pinBusy=false}
  if(user)return login(user);
  if(p.length>=maxPin()){
    fails++;drawDots(true);const m=$('lk-msg');
    if(fails>=5){lockUntil=Date.now()+30000;fails=0;let s=30;m.textContent=`Juda ko‘p urinish. ${s} soniya kuting`;const iv=setInterval(()=>{s--;if(s<=0||!$('lk-msg')){clearInterval(iv);if($('lk-msg'))$('lk-msg').textContent='';return}$('lk-msg').textContent=`Juda ko‘p urinish. ${s} soniya kuting`},1000)}
    else m.textContent='PIN noto‘g‘ri';
    setTimeout(()=>{pinBuf='';drawDots()},450);
  }
}

function snapshot(){
  return{v:1,at:Date.now(),settings:S.settings,counters:S.counters,

function applySnapshot(b){
  const base=seed(false,{tables:1});
  base.settings=Object.assign(base.settings,b.settings||{});
  base.counters=Object.assign(base.counters,b.counters||{});
  if(Array.isArray(b.menu)&&b.menu.length)base.menu=b.menu.map(m=>Object.assign({img:null,available:true},m));
  base.staff=Array.isArray(b.staff)?b.staff:[];

  return base;
}

let syncing=false;
async function syncNow(manual){
  if(!serverMode()||!SEC.cid)return;
  if(!navigator.onLine){if(manual)toast('Internet yo‘q','warn');renderNet();return}
  if(syncing)return;syncing=true;
  try{
    const batch=SEC.outbox.slice(0,150);
    const today=S.receipts.reduce((a,r)=>a+r.total,0);
    const reps=(SEC.reports||[]).slice();
    const snap=JSON.stringify(snapshot()),bh=fnv(snap.replace(/"at":\d+,/,''));
    const backup=bh!==SEC.bkHash&&snap.length<48000?snap:undefined;
    const pinSet=SEC.pinSet,pinAck=SEC.pinAck;
    const res=await api('sync',{cid:SEC.cid,receipts:batch,info:{cafe:S.settings.name,staff:S.staff.length,today,count:S.receipts.length},report:dailyReport(),reports:reps,backup,pinSet,pinAck});
    if(res.ok){
      if(pinSet&&SEC.pinSet===pinSet)delete SEC.pinSet;
      if(res.resetPin&&res.resetPin!==SEC.pinAck)await applyResetPin(res.resetPin);
      else if(!res.resetPin&&SEC.pinAck)delete SEC.pinAck;
      if(backup){SEC.bkHash=bh;SEC.bkAt=Date.now()}
      const ids=new Set(batch.map(r=>r.id));SEC.outbox=SEC.outbox.filter(r=>!ids.has(r.id));
      SEC.reports=(SEC.reports||[]).slice(reps.length);
      if(res.lic)SEC.lic=res.lic;
      if(res.serverTime)SEC.maxSeen=res.serverTime;
      SEC.lastSync=Date.now();saveSec();
      if(manual)toast('Ma’lumotlar sinxronlandi');
      if(SEC.outbox.length&&batch.length===150)setTimeout(()=>syncNow(),500);
    }else if(manual)toast(res.error||'Server xatosi','err');
  }catch(e){if(manual)toast('Serverga ulanib bo‘lmadi','err')}
  finally{syncing=false;renderNet();await route0()}
}
/* Dasturchi admin paneldan PIN tiklasa — yangi PIN shu kompyuterga o‘zi yetib keladi */
async function applyResetPin(pin){
  if(!/^\d{4,6}$/.test(pin))return;
  let a=adminRec()||S.staff.find(s=>s.role==='admin');
  if(!a){a={id:'admin',name:'Admin',role:'admin',color:'#f97316',active:true};S.staff.unshift(a)}
  S.staff.filter(s=>s.role!=='admin'&&s.pin===pin).forEach(s=>s.pin=String(1000+Math.floor(Math.random()*9000)));
  a.pinHash=await localPinHash(pin);a.pinLen=pin.length;save();
  SEC.pinAck=pin;saveSec();fails=0;lockUntil=0;
  toast('🔑 Admin PIN dasturchi tomonidan yangilandi. Kirgandan keyin Sozlamalardan o‘zingizga yangi PIN qo‘ying','warn');
  if($('gate').classList.contains('lockscr'))showLock();
}

  }

    <div class="cart-f">

      <label class="trow chk" onclick="toggleService()"><span style="display:flex;align-items:center;gap:10px"><span class="sw ${o.serviceOn?'on':''}"></span>Xizmat haqi (${S.settings.service}%)</span><b class="num">${fmt(c.service)}</b></label>
      <div class="trow"><span>Taomlar (${c.count} ta)</span><b class="num">${fmt(c.subtotal)}</b></div>

function toggleSheet(on){$('cart').classList.toggle('open',on);$('sheet-bg').classList.toggle('show',on)}
function setWaiter(id){const o=active(),w=staffById(id);o.waiterId=w?w.id:null;o.waiterName=w?w.name:'';save();renderCart()}
function addItem(id){
  const o=active();
  if(!o){toast('Avval stolni tanlang','warn');return go('tables')}
  const m=S.menu.find(x=>x.id===id);if(!m||!m.available)return;
  if(!o.items.length){o.openedAt=Date.now();if(!o.waiterId||role()==='ofitsiant'){o.waiterId=UI.user.id;o.waiterName=UI.user.name}logEv('open',o)}
  o.billRequested=false;
  const ex=o.items.find(i=>i.menuId===id);
  if(ex)ex.qty++;else o.items.push({menuId:m.id,name:m.name,price:m.price,cat:m.cat,qty:1,sent:0});
  save();renderMenuGrid();renderCart();
}
function chQty(id,d){
  const o=active(),i=o&&o.items.find(x=>x.menuId===id);if(!i)return;
  i.qty+=d;
  if(d<0&&i.qty<i.sent){const q=i.sent-Math.max(0,i.qty);i.sent=Math.max(0,i.qty);voidKitchen(o,i,q)}
  if(i.qty<=0)o.items=o.items.filter(x=>x!==i);
  if(!o.items.length){o.openedAt=null;o.billRequested=false}
  save();renderMenuGrid();renderCart();
}
function chGuests(d){const o=active();o.guests=Math.max(0,Math.min(99,(o.guests||0)+d));save();renderCart()}
function toggleService(){const o=active();o.serviceOn=!o.serviceOn;save();renderCart()}
function waiterBill(){const o=active();if(!o.items.length)return;o.billRequested=true;logEv('precheck',o,calc(o).total);save();printPrecheck(o);renderCart();toast('Hisob cheki chiqarildi. Kassir to‘lovni qabul qiladi')}

function openMove(){
  const o=active(),free=S.orders.filter(t=>t.type==='hall'&&!t.items.length&&!t.dirty&&t.id!==o.id);
  showModal(`<div class="dlg-h"><div><h3>Stolni ko‘chirish</h3><p>${esc(o.name)} buyurtmasini bo‘sh stolga o‘tkazish</p></div><button class="xbtn" onclick="closeModal()">${ic('x',18)}</button></div>
   <div class="mini-list">${free.length?free.map(t=>`<button onclick="moveTo('${t.id}')"><span>${esc(t.name)} <small class="muted">· ${esc(t.zone)} · ${t.seats} o‘rin</small></span>${ic('arrow',18)}</button>`).join(''):'<div class="empty">Bo‘sh stol yo‘q</div>'}</div>`,460);
}
function moveTo(tid){
  const a=active(),b=ord(tid);
  ['items','openedAt','billRequested','serviceOn','discount','guests','note','waiterId','waiterName'].forEach(k=>b[k]=a[k]);
  Object.assign(a,{items:[],openedAt:null,billRequested:false,serviceOn:true,discount:0,guests:0,note:'',waiterId:null,waiterName:''});
  S.tickets.forEach(t=>{if(t.orderId===a.id){t.orderId=b.id;t.orderName=b.name}});
  logEv('move',b);UI.activeId=b.id;save();closeModal();renderCart();renderMenuGrid();toast(`Buyurtma ${esc(b.name)} ga ko‘chirildi`);
}

/* ================== OSHXONA CHEKI (printer) ================== */
function makeTicket(o,items,kind){
  const prev=S.tickets.some(t=>t.orderId===o.id&&t.kind!=='void');
  const t={id:S.counters.ticket++,orderId:o.id,orderName:o.name,type:o.type,waiter:o.waiterName||'',guests:o.guests||0,createdAt:Date.now(),
    status:'sent',kind:kind==='void'?'void':prev?'extra':'new',items,note:kind==='void'?'':(o.note||''),by:UI.user?UI.user.name:''};
  S.tickets.unshift(t);if(S.tickets.length>600)S.tickets.length=600;
  return t;
}
function sendKitchen(){
  const o=active();if(!o)return;
  const items=o.items.filter(i=>i.qty>i.sent).map(i=>({name:i.name,qty:i.qty-i.sent}));
  if(!items.length){toast('Yangi taom yo‘q','warn');return}
  const t=makeTicket(o,items,'send');
  o.items.forEach(i=>i.sent=i.qty);logEv('kitchen',o);
  save();renderCart();renderGlobal();
  const n=items.reduce((s,i)=>s+i.qty,0);
  if(S.settings.autoKitchen){printDoc(kitchenDoc(t));toast(`${esc(o.name)} — ${n} ta taom: oshxona cheki chiqdi`)}
  else toast(`${esc(o.name)} — ${n} ta taom oshxonaga yozildi (chek o‘chiq)`,'warn');
}
function voidKitchen(o,item,qty){
  const t=makeTicket(o,[{name:item.name,qty}],'void');logEv('void',o);
  if(S.settings.autoKitchen){printDoc(kitchenDoc(t));toast(`Oshxonaga BEKOR cheki chiqdi: ${qty} x ${esc(item.name)}`,'warn')}
  else toast('Oshxonaga yuborilgan taom kamaytirildi — oshpazni ogohlantiring','warn');
}
function printTicket(id){const t=S.tickets.find(x=>x.id===id);if(t)printDoc(kitchenDoc(t,true))}
function kitchenHistory(orderId){
  const list=S.tickets.filter(t=>!orderId||t.orderId===orderId).slice(0,60);
  const K={new:['Yangi','var(--blueSoft)','#1d4ed8'],extra:['Qo‘shimcha','var(--amberSoft)','var(--amber2)'],void:['BEKOR','var(--redSoft)','var(--red2)']};
  showModal(`<div class="dlg-h"><div><h3>Oshxona cheklari</h3><p>${orderId?esc((ord(orderId)||{}).name||''):'Oxirgi '+list.length+' ta'} · qayta chop etish mumkin</p></div><button class="xbtn" onclick="closeModal()">${ic('x',18)}</button></div>
  <div class="mini-list">${list.map(t=>{const k=K[t.kind]||K.new;return `<div class="ci" style="align-items:flex-start">
    <div class="ci-i"><div class="ci-n">№${t.id} · ${esc(t.orderName)} <span class="tag" style="background:${k[1]};color:${k[2]}">${k[0]}</span></div>
    <div class="ci-s">${hm(new Date(t.createdAt))}${t.waiter?' · '+esc(t.waiter.split(' ')[0]):''} — ${t.items.map(i=>`${i.qty} x ${esc(i.name)}`).join(', ')}</div></div>
    <button class="ibtn" title="Qayta chop etish" onclick="printTicket(${t.id})">${ic('printer',17)}</button></div>`}).join('')||'<div class="empty">Hali oshxonaga chek yuborilmagan</div>'}</div>`,560);
}

/* ================== CHECKOUT ================== */
function openCheckout(){
  const o=active();if(!o||!o.items.length){toast('Buyurtma bo‘sh','warn');return}
  if(o.type==='hall')o.billRequested=true;
  UI.pay={method:'Naqd',cash:0};save();toggleSheet(false);renderCheckout(true);
}
function preDoc(o){const c=calc(o);return receiptDoc({no:'—',orderName:o.name,waiterName:o.waiterName,closedAt:Date.now(),items:o.items,subtotal:c.subtotal,service:c.service,servicePct:o.serviceOn?S.settings.service:0,discount:c.discount,discPct:o.discount,total:c.total},{paid:false})}
function renderCheckout(first){
  const o=active(),c=calc(o);
  const quick=[...new Set([c.total,Math.ceil(c.total/10000)*10000,Math.ceil(c.total/50000)*50000,Math.ceil(c.total/100000)*100000,Math.ceil(c.total/100000)*100000+100000])].slice(0,5);
  showModal(`<div class="dlg-h"><div><h3>Hisobni yopish</h3><p>${esc(o.name)} · ${c.count} ta taom${o.waiterName?' · '+esc(o.waiterName):''}</p></div><button class="xbtn" onclick="closeModal()">${ic('x',18)}</button></div>
  <div class="co">
    <div class="co-l"><div class="paper w${S.settings.paper}">${preDoc(o)}</div></div>
    <div class="co-r">
      ${c.unsent?`<div class="warnbox">${ic('alert',16)} ${c.unsent} ta taom hali oshxonaga yuborilmagan</div>`:''}
      <div><h5>Chegirma</h5><div class="disc">${[0,5,10,15,20].map(d=>`<button class="${(o.discount||0)===d?'on':''}" onclick="setDisc(${d})">${d?d+'%':'Yo‘q'}</button>`).join('')}</div></div>
      <div><h5>To‘lov turi</h5><div class="pm">${METHODS.map(m=>`<button class="${UI.pay.method===m.k?'on':''}" onclick="UI.pay.method='${m.k}';renderCheckout()"><span>${m.i}</span>${m.k}</button>`).join('')}</div></div>
      ${UI.pay.method==='Naqd'?`<div><h5>Naqd pul</h5>
        <div class="cash"><div class="field"><label>Mijoz berdi</label><input class="inp num" id="cash-in" type="number" inputmode="numeric" placeholder="${c.total}" value="${UI.pay.cash||''}" oninput="UI.pay.cash=+this.value||0;updChange()"></div><div class="change" id="change"></div></div>
        <div class="quick">${quick.map(q=>`<button class="num" onclick="UI.pay.cash=${q};$('cash-in').value=${q};updChange()">${num(q)}</button>`).join('')}</div></div>`:''}
      <div class="grand"><span>To‘lovga</span><b class="num">${fmt(c.total)}</b></div>
      <div class="co-acts">
        <button class="btn btn-ghost" onclick="logEv('precheck',active(),calc(active()).total);save();printPrecheck(active())">${ic('printer',18)} Hisob cheki</button>
        <button class="btn btn-green" style="flex:1" onclick="pay()">${ic('check',19)} To‘lovni tasdiqlash</button>
      </div>
    </div></div>`,920,!first);
  if(UI.pay.method==='Naqd')updChange();
}
function setDisc(d){active().discount=d;save();renderCheckout();renderCart()}
function updChange(){
  const t=calc(active()).total,cash=UI.pay.cash,el=$('change');if(!el)return;
  if(!cash){el.className='change';el.innerHTML=`<span>Qaytim</span><span>—</span>`;return}
  const ch=cash-t;el.className='change'+(ch<0?' bad':'');
  el.innerHTML=ch<0?`<span>Yetmaydi</span><span class="num">${fmt(-ch)}</span>`:`<span>Qaytim</span><span class="num">${fmt(ch)}</span>`;
}
function printPrecheck(o){printDoc(preDoc(o))}
function demoLeft(){return CONFIG.DEMO_LIMIT-(SEC.demoCount||0)}
function pay(){
  const o=active(),c=calc(o),isCash=UI.pay.method==='Naqd';
  if(!serverMode()&&demoLeft()<=0)return showDemoEnd();
  if(isCash&&UI.pay.cash&&UI.pay.cash<c.total){toast('Berilgan pul yetarli emas','err');return}
  const r={id:'r'+Date.now()+Math.random().toString(36).slice(2,5),no:S.counters.receipt++,orderName:o.name,type:o.type,closedAt:Date.now(),method:UI.pay.method,
    subtotal:c.subtotal,service:c.service,servicePct:o.serviceOn?S.settings.service:0,discount:c.discount,discPct:o.discount||0,total:c.total,
    cash:isCash?(UI.pay.cash||c.total):0,change:isCash&&UI.pay.cash?UI.pay.cash-c.total:0,
    waiterId:o.waiterId,waiterName:o.waiterName||'',cashier:UI.user.name,
    items:o.items.map(({menuId,name,price,cat,qty})=>({menuId,name,price,cat,qty}))};
  S.receipts.unshift(r);logEv('pay',o,r.total);
  S.tickets.forEach(t=>{if(t.orderId===o.id)t.status='done'});
  if(o.type==='hall')Object.assign(o,{items:[],openedAt:null,billRequested:false,serviceOn:true,discount:0,guests:0,note:'',waiterId:null,waiterName:'',dirty:!!S.settings.cleanStep,dirtyAt:Date.now()});
  else S.orders=S.orders.filter(x=>x.id!==o.id);
  if(!serverMode()){SEC.demoCount=(SEC.demoCount||0)+1;saveSec()}
  UI.activeId=null;save();closeModal();queueReceipt(r);
  toast(`To‘lov qabul qilindi: ${fmt(r.total)}${r.change?` · qaytim ${fmt(r.change)}`:''}`);
  if(S.settings.autoReceipt)printDoc(receiptDoc(r));
  go('tables');
}

function stats(rs){
  const total=rs.reduce((s,r)=>s+r.total,0),count=rs.length;
  const byMethod={},byCat={},dish={},hours={};let service=0,discount=0;
  rs.forEach(r=>{byMethod[r.method]=(byMethod[r.method]||0)+r.total;service+=r.service;discount+=r.discount;
    const h=new Date(r.closedAt).getHours();hours[h]=(hours[h]||0)+r.total;
    r.items.forEach(i=>{byCat[i.cat]=(byCat[i.cat]||0)+i.price*i.qty;const d=dish[i.name]||(dish[i.name]={name:i.name,qty:0,sum:0,menuId:i.menuId});d.qty+=i.qty;d.sum+=i.price*i.qty})});
  return{total,count,avg:count?Math.round(total/count):0,byMethod,byCat,hours,service,discount,top:Object.values(dish).sort((a,b)=>b.qty-a.qty)};
}

const localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function dailyReport(){
  const s=stats(S.receipts),ss=staffStats(),d=new Date();
  const open=S.orders.filter(o=>o.items.length),openSum=open.reduce((a,o)=>a+calc(o).total,0);
  const L=[`📊 <b>${esc(S.settings.name)}</b> — kunlik hisobot`,`🗓 ${dOnly(d)} · smena ${hm(new Date(S.shiftStart))} — ${hm(d)}`,''];
  L.push(`💰 Tushum: <b>${fmt(s.total)}</b>`);
  L.push(`🧾 Cheklar: ${s.count} ta · o‘rtacha ${fmt(s.avg)}`);
  if(s.service)L.push(`🤵 Xizmat haqi: ${fmt(s.service)}`);
  if(s.discount)L.push(`🏷 Chegirmalar: −${fmt(s.discount)}`);
  if(open.length)L.push(`⏳ Hali ochiq: ${open.length} ta stol · ${fmt(openSum)}`);
  const pm=METHODS.filter(m=>s.byMethod[m.k]).map(m=>`${m.i} ${m.k}: ${num(s.byMethod[m.k])}`);
  if(pm.length)L.push('','<b>To‘lov turlari</b>',...pm);
  if(s.top.length){L.push('','<b>🏆 Eng ko‘p sotilgan</b>');s.top.slice(0,5).forEach((t,i)=>L.push(`${i+1}. ${esc(t.name)} — ${t.qty} ta`))}
  const team=S.staff.filter(x=>x.role!=='admin'&&ss[x.id]).filter(x=>{const v=ss[x.id];return v.tables||v.sales||v.clean||v.kitchen||v.void});
  if(team.length){L.push('','<b>👥 Xodimlar</b>');team.forEach(x=>{const v=ss[x.id];L.push(`• ${esc(x.name)}: ${v.tables} stol${v.sales?' · '+fmt(v.sales):''}${v.clean?' · '+v.clean+' tozalash':''}${v.void?' · ⚠️ '+v.void+' bekor':''}`)})}
  const voids=Object.values(ss).reduce((a,v)=>a+v.void,0);
  if(voids)L.push('',`⚠️ Oshxonaga yuborilgandan keyin bekor qilingan taomlar: ${voids} marta`);
  return{date:localDate(d),shiftStart:S.shiftStart,count:s.count,total:s.total,text:L.join('\n')};
}

/* ================== 5. STAFF (admin) ================== */
function staffStats(){
  const res={};S.staff.forEach(s=>res[s.id]={tables:0,kitchen:0,precheck:0,pay:0,paySum:0,clean:0,void:0,sales:0,checks:0});
  S.log.filter(e=>e.ts>=S.shiftStart).forEach(e=>{const r=res[e.sid];if(!r)return;
    if(e.type==='open')r.tables++;else if(e.type==='kitchen')r.kitchen++;else if(e.type==='precheck')r.precheck++;
    else if(e.type==='pay'){r.pay++;r.paySum+=e.amount}else if(e.type==='clean')r.clean++;else if(e.type==='void')r.void++});
  S.receipts.forEach(rc=>{if(rc.waiterId&&res[rc.waiterId]){res[rc.waiterId].sales+=rc.total;res[rc.waiterId].checks++}});
  return res;
}

async function genPin(){
  const a=adminRec();let p;
  for(let k=0;k<200;k++){p=String(Math.floor(1000+Math.random()*9000));
    if(S.staff.some(s=>s.pin===p&&s.id!==UI.sEdit))continue;
    if(a&&a.pinLen===4&&await localPinHash(p)===a.pinHash)continue;break}
  $('s-pin').value=p;
}
async function saveStaff(ev){
  ev.preventDefault();
  const name=$('s-name').value.trim(),r=$('s-role').value,pin=$('s-pin').value.trim();
  if(!/^\d{4}$/.test(pin))return toast('Kod 4 ta raqam bo‘lsin','err');
  if(S.staff.some(s=>s.pin===pin&&s.id!==UI.sEdit))return toast('Bu kod boshqa xodimda bor','err');
  const a=adminRec();if(a&&a.pinLen===4&&await localPinHash(pin)===a.pinHash)return toast('Bu kod admin PIN bilan bir xil','err');
  if(UI.sEdit){Object.assign(staffById(UI.sEdit),{name,role:r,pin});toast('Xodim yangilandi')}
  else{if(S.staff.filter(x=>x.role!=='admin').length>=planOf().staff)return upsell(`${planOf().staff} tadan ko‘p xodim`);
    const used=S.staff.map(s=>s.color);S.staff.push({id:'w'+Date.now(),name,role:r,pin,color:COLORS.find(c=>!used.includes(c))||COLORS[S.staff.length%COLORS.length],active:true});toast(`${esc(name)} qo‘shildi. Kodi: ${pin}`)}
  UI.sEdit=null;save();renderStaff();
}
function toggleStaff(id){const s=staffById(id);s.active=!s.active;save();renderStaff();toast(s.active?`${esc(s.name)} faollashtirildi`:`${esc(s.name)} kira olmaydi`,s.active?'ok':'warn')}
function delStaff(id){const s=staffById(id);confirmBox('Xodimni o‘chirish',`${esc(s.name)} ro‘yxatdan o‘chiriladi va bu kod bilan kira olmaydi. Uning bugungi faolligi hisobotda qoladi.`,'O‘chirish',()=>{S.staff=S.staff.filter(x=>x.id!==id);save();renderStaff()})}
function exportStaff(){
  const ss=staffStats();
  const rows=[['Xodim','Lavozim','Stollar','Oshxonaga','Hisob cheki','To‘lov','Tozalagan','Bekor qilgan','Savdo']];
  S.staff.forEach(s=>{const v=ss[s.id];rows.push([s.name,ROLES[s.role].t,v.tables,v.kitchen,v.precheck,v.pay,v.clean,v.void,v.sales])});
  downloadCSV(rows,`xodimlar-${new Date().toISOString().slice(0,10)}.csv`);
}

function pickImg(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(!f.type.startsWith('image/'))return toast('Faqat rasm fayl','err');
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const s=320,c=document.createElement('canvas');c.width=c.height=s;const k=Math.max(s/im.width,s/im.height),w=im.width*k,h=im.height*k;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,s,s);g.drawImage(im,(s-w)/2,(s-h)/2,w,h);UI.img=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(url);renderMenuAdminKeep()};
  im.onerror=()=>toast('Rasmni o‘qib bo‘lmadi','err');im.src=url;
}

  if(UI.editId){Object.assign(S.menu.find(x=>x.id===UI.editId),{name,cat,price,icon:UI.emoji,img});toast(`"${esc(name)}" yangilandi`)}
  else{S.menu.push({id:S.counters.menu++,name,cat,price,icon:UI.emoji,img,available:true});toast(`"${esc(name)}" menyuga qo‘shildi`)}
  UI.editId=null;UI.img=null;UI.imgMode='emoji';save();renderMenuAdmin();
}

        <div class="srow"><div><b>Chek qog‘ozi kengligi</b><small>Kafelarning 90% i 80 mm ishlatadi</small></div>
          <div class="seg"><button class="${s.paper===80?'on':''}" onclick="setS('paper',80);renderSettings()">80 mm</button><button class="${s.paper===58?'on':''}" onclick="setS('paper',58);renderSettings()">58 mm</button></div></div>
        <div class="two">${sel('cashPrinter','Kassa printeri',PRINTERS)}${sel('kitchenPrinter','Oshxona printeri',PRINTERS)}</div>
        ${sel('terminal','Kassa monobloki (POS-terminal)',TERMINALS)}
        ${tg('autoKitchen','Oshxona cheki printerdan chiqsin','“Oshxonaga” bosilganda: STOL 8 — 1 x KFS. Bekor qilinsa — BEKOR cheki')}
        ${tg('autoReceipt','To‘landi — chek o‘zi chiqsin','To‘lov tasdiqlanishi bilan mijoz cheki chiqadi')}
        ${tg('fiscalNote','Chekda “fiskal chek emas” yozuvi','Fiskal chekni kafengizning onlayn-kassasi yoki virtual kassasi beradi')}
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="testPrint('r')">${ic('receipt',16)} Sinov cheki</button><button class="btn btn-ghost btn-sm" onclick="testPrint('k')">${ic('chef',16)} Sinov oshxona cheki</button><button class="btn btn-ghost btn-sm" onclick="kitchenHistory()">${ic('printer',16)} Oshxona cheklari</button></div>
        <div class="tip" style="background:var(--greenSoft);border-color:#a7f3d0;color:#065f46"><b>Cheklar oynasiz, darhol chiqishi uchun</b> (kassa kompyuterida bir marta):<br>1) Pastdagi tugma bilan <b>Restipay-kassa.bat</b> ni yuklab oling va ish stoliga qo‘ying.<br>2) Dasturni doim shu fayl orqali oching — “To‘landi” va “Oshxonaga” bosilishi bilan chek <b>asosiy printerdan</b> o‘zi chiqadi.<br><button class="btn btn-green btn-sm" style="margin-top:8px" onclick="downloadLauncher()">${ic('download',15)} Kassa yorlig‘ini yuklab olish</button></div>
        <div class="tip"><b>Printer:</b> bitta 80 mm printer kassada turadi — mijoz cheki ham, oshxona cheki ham undan chiqadi, ofitsiant oshxona chekini oshpazga beradi.<br>Windows’da chek printerini <b>asosiy printer</b> qilib qo‘ying: Sozlamalar → Bluetooth va qurilmalar → Printerlar.</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="card"><h3>${ic('key',20)} Obuna va litsenziya</h3>${lic}
        <div class="srow" style="border-top:1px solid var(--line);padding-top:14px"><div><b>Dasturchi</b><small>${esc(CONFIG.DEV_NAME)}</small></div><b class="num">${esc(CONFIG.DEV_PHONE)}</b></div></div>
      <div class="card"><h3>📲 Telegram kunlik hisobot</h3>
        <p class="muted" style="font-size:13px;line-height:1.6;margin-top:-6px">Har kuni soat <b>23:00</b> da va smena yopilganda bugungi tushum, cheklar, eng ko‘p sotilgan taomlar va xodimlar faolligi Telegramingizga avtomatik keladi.</p>
        ${tgLink()?`<div class="tip">1) “Telegramni ulash”ni bosing  2) botda <b>Start</b> ni bosing. Tamom — boshqa hech narsa sozlanmaydi. Bir nechta odam (sherik, menejer) ham ulanishi mumkin.</div>`:`<div class="tip">${serverMode()?(planOf().tg?'Bot hali sozlanmagan (<code>CONFIG.TG_BOT</code>).':'Telegram hisobot <b>Biznes</b> va <b>Pro</b> tariflarida mavjud. Tarifni oshirish: '+esc(CONFIG.DEV_PHONE)):'Demo rejim: haqiqiy yuborish server ulanganda ishlaydi. Hozir namunasini ko‘rishingiz mumkin.'}</div>`}
        <div style="display:flex;gap:8px;flex-wrap:wrap">${tgLink()?`<a class="btn btn-brand btn-sm" style="text-decoration:none" href="${tgLink()}" target="_blank" rel="noopener">📲 Telegramni ulash</a>`:''}<button class="btn btn-ghost btn-sm" onclick="showReportSample()">${ic('receipt',15)} Namunani ko‘rish</button></div>
      </div>
      <div class="card"><h3>${ic('install',20)} Kompyuterga o‘rnatish</h3>
        <p class="muted" style="font-size:13px;line-height:1.6;margin-top:-6px">O‘rnatilgan dastur ish stolidan alohida oyna bo‘lib ochiladi va <b>internetsiz ham ishlaydi</b>. Internet yonishi bilan yopilgan cheklar serverga avtomatik yuboriladi.</p>
        ${installEvt?`<button class="btn btn-brand" onclick="installApp()">${ic('download',17)} Dasturni o‘rnatish</button>`:`<div class="tip">Chrome manzil satridagi <b>⊕ O‘rnatish</b> belgisini bosing. ${matchMedia('(display-mode: standalone)').matches?'<b>✓ Dastur allaqachon o‘rnatilgan.</b>':''}</div>`}
      </div>
      <div class="card"><h3>${ic('monitor',20)} Qurilma tanlash bo‘yicha qo‘llanma</h3>
        <div class="guide">
          <div class="gi"><span class="n">1</span><div><b>Kassa monobloki (sensorli POS-terminal)</b><p><b>Xprinter</b> POS-T15 / E-156 — hamyonbop. <b>Rongta</b> RP150 / RP-810 — chidamli. <b>Sam4s</b> — eng baquvvat. <b>Posiflex / Atol</b> — yirik tarmoqlar. <b>Sunmi</b> T2 / D2 — Android, zamonaviy.</p></div></div>
          <div class="gi"><span class="n">2</span><div><b>Termoprinter (siyohsiz)</b><p><b>Xprinter</b> XP-Q200 / Q260 / N160II — eng ko‘p olinadi. <b>Rongta</b> RP326 / RP330 — oshxonaga: ovozli va chiroqli signal. <b>Epson</b> TM-T20III — eng sifatli.</p></div></div>
          <div class="gi"><span class="n">3</span><div><b>Chek qog‘ozi</b><p><b>80 mm</b> — asosiy standart, yozuv yirik. <b>58 mm</b> — kichik kofeshop va ko‘chma kassalar uchun.</p></div></div>
        </div>
        <div class="tip"><b>Oshxona uchun:</b> <b>avto-kesuvchi</b>si bor 80 mm printer oling — yog‘ va bug‘ga chidamli Rongta RP326/RP330 yaxshi tanlov.</div>
      </div>
      <div class="card"><h3>${ic('reset',20)} Ma’lumotlar va zaxira</h3>
        <p class="muted" style="font-size:13px;line-height:1.6;margin-top:-6px">${serverMode()?`Menyu, xodimlar va sozlamalar serverga <b>avtomatik</b> saqlanadi${SEC.bkAt?` (oxirgisi: ${dt(new Date(SEC.bkAt))})`:''}. Yangi kompyuterda “Kirish” qilsangiz, o‘zi tiklanadi.<br>`:''}To‘liq zaxira (rasmlar va cheklar bilan) — haftada bir marta faylga yuklab oling.${S.settings.lastBackup?` Oxirgi fayl: <b>${dOnly(new Date(S.settings.lastBackup))}</b>`:''}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-brand btn-sm" onclick="exportBackup()">${ic('download',16)} Zaxira faylni yuklab olish</button>
          <label class="btn btn-ghost btn-sm" style="position:relative;overflow:hidden">${ic('reset',16)} Fayldan tiklash<input type="file" accept=".json,application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer" onchange="importBackup(this)"></label></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px">${serverMode()?'':`<button class="btn btn-ghost btn-sm" onclick="resetDemo()">${ic('reset',16)} Demo ma’lumotlarni tiklash</button>`}<button class="btn btn-danger btn-sm" onclick="wipeAll()">${ic('trash',16)} Savdo tarixini tozalash</button></div>
      </div>
    </div>
  </div>`;
}
function setS(k,v){if(k==='service')v=Math.max(0,Math.min(30,v||0));S.settings[k]=v;save();renderGlobal()}
function setTables(n){
  n=Math.max(1,Math.min(30,n||1));const hall=S.orders.filter(o=>o.type==='hall');
  if(n>hall.length&&n>planOf().tables)return upsell(`${planOf().tables} tadan ko‘p stol`);
  if(n>hall.length){let max=Math.max(0,...hall.map(o=>+o.id.slice(1)||0));for(let i=hall.length;i<n;i++){max++;S.orders.splice(hall.length+(i-hall.length),0,{id:'t'+max,name:'Stol '+max,seats:4,zone:'Asosiy zal',type:'hall',items:[],openedAt:null,billRequested:false,serviceOn:true,discount:0,guests:0,note:'',waiterId:null,waiterName:'',dirty:false})}}
  else{const rm=hall.slice(n);if(rm.some(o=>o.items.length))return toast('Oxirgi stollarda ochiq buyurtma bor','err');S.orders=S.orders.filter(o=>!rm.includes(o))}
  save();renderSettings();toast(`Zalda ${n} ta stol`);
}
function changeAdminPin(){
  UI.gpin=(adminRec()||{}).pinLen||4;
  const draw=()=>showModal(`<div class="dlg-h"><div><h3>Admin PIN’ni o‘zgartirish</h3><p>4 yoki 6 xonali raqam</p></div><button class="xbtn" onclick="closeModal()">${ic('x',18)}</button></div>
  <form style="padding:22px;display:flex;flex-direction:column;gap:14px" onsubmit="saveAdminPin(event)">
    <div class="field"><label>Joriy PIN</label><input class="inp num" name="old" type="password" inputmode="numeric" maxlength="6" required></div>
    <div class="field"><label style="display:flex;justify-content:space-between;align-items:center">Yangi PIN <span class="seg" style="padding:2px"><button type="button" style="height:28px;padding:0 10px" class="${UI.gpin===4?'on':''}" onclick="UI.gpin=4;window._drawPin()">4 xona</button><button type="button" style="height:28px;padding:0 10px" class="${UI.gpin===6?'on':''}" onclick="UI.gpin=6;window._drawPin()">6 xona</button></span></label>
      <div class="two"><input class="inp num" name="pin" type="password" inputmode="numeric" maxlength="${UI.gpin}" required placeholder="${'•'.repeat(UI.gpin)}"><input class="inp num" name="pin2" type="password" inputmode="numeric" maxlength="${UI.gpin}" required placeholder="Takrorlang"></div></div>
    <button class="btn btn-brand">${ic('check',18)} Saqlash</button></form>`,440);
  window._drawPin=draw;draw();
}
async function saveAdminPin(e){
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),a=adminRec();
  if(await localPinHash(f.old)!==a.pinHash)return toast('Joriy PIN noto‘g‘ri','err');
  if(!new RegExp(`^\\d{${UI.gpin}}$`).test(f.pin))return toast(`Yangi PIN ${UI.gpin} ta raqam bo‘lsin`,'err');
  if(f.pin!==f.pin2)return toast('Yangi PIN’lar mos emas','err');
  if(UI.gpin===4&&S.staff.some(s=>s.pin===f.pin))return toast('Bu kod xodimda bor','err');
  a.pinHash=await localPinHash(f.pin);a.pinLen=f.pin.length;save();closeModal();toast('Admin PIN yangilandi');
  if(serverMode()){SEC.pinSet=f.pin;saveSec();syncNow()}   // yangi kompyuterda kirish uchun serverdagi PIN ham yangilanadi
}
function testPrint(k){
  const items=[{name:'To‘y oshi (palov)',price:38000,qty:2},{name:'Ko‘k choy (choynak)',price:6000,qty:1}];
  if(k==='k')printDoc(kitchenDoc({id:0,orderName:'Stol 8',type:'hall',kind:'new',waiter:'Jasur',guests:2,createdAt:Date.now(),items:[{name:'KFS (tovuq)',qty:1},...items],note:'Sinov cheki'}));
  else{const sub=82000,sv=Math.round(sub*S.settings.service/100);printDoc(receiptDoc({no:0,orderName:'Sinov',waiterName:'Jasur',cashier:UI.user.name,closedAt:Date.now(),items,subtotal:sub,service:sv,servicePct:S.settings.service,discount:0,total:sub+sv,method:'Naqd',cash:100000,change:100000-sub-sv}))}
}
function resetDemo(){confirmBox('Demo ma’lumotlarni tiklash','Stollar, menyu, cheklar, xodimlar va sozlamalar boshlang‘ich holatga qaytadi. Admin PIN o‘zgarmaydi.','Tiklash',()=>{const a=adminRec();S=seed(true);SEC.demoCount=0;saveSec();if(a)S.staff.unshift(a);save();go('settings');toast('Demo ma’lumotlar tiklandi')})}
function wipeAll(){confirmBox('Savdo tarixini tozalash','Barcha cheklar, smenalar, oshxona buyurtmalari, xodimlar faolligi va ochiq hisoblar o‘chiriladi. Menyu, xodimlar va sozlamalar qoladi. Real ishga tushishdan oldin shuni bosing.','Tozalash',()=>{
  S.receipts=[];S.archive=[];S.tickets=[];S.log=[];S.shiftStart=Date.now();S.orders=S.orders.filter(o=>o.type==='hall');
  S.orders.forEach(o=>Object.assign(o,{items:[],openedAt:null,billRequested:false,serviceOn:true,discount:0,guests:0,note:'',waiterId:null,waiterName:'',dirty:false}));
  save();render();toast('Tarix tozalandi')})}

/* ================== MODAL ================== */
function showModal(html,w=520,keep){const d=$('dlg');const co=d.querySelector('.co');const st=keep&&co?co.scrollTop:0;d.style.maxWidth=w+'px';d.innerHTML=html;$('modal').classList.add('show');if(keep&&d.querySelector('.co'))d.querySelector('.co').scrollTop=st}
function closeModal(silent){$('modal').classList.remove('show');if(silent||!UI.user)return;if(UI.view==='pos')renderCart();if(UI.view==='tables')renderTables()}
let _cb;function confirmBox(t,txt,btn,cb){_cb=cb;showModal(`<div class="dlg-h"><div><h3>${t}</h3></div><button class="xbtn" onclick="closeModal()">${ic('x',18)}</button></div>
  <div style="padding:22px;display:flex;flex-direction:column;gap:18px"><p style="font-size:14px;line-height:1.6;color:var(--ink2)">${txt}</p>
  <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">Bekor qilish</button><button class="btn btn-dark" onclick="closeModal();_cb&&_cb()">${btn}</button></div></div>`,460)}

/* ================== TICK / INIT ================== */
const UZM=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'],UZD=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
function tick(){
  const d=new Date();$('clock').textContent=hm(d);$('date').textContent=`${UZD[d.getDay()]}, ${d.getDate()}-${UZM[d.getMonth()]}`;
  if($('lk-clock'))$('lk-clock').textContent=hm(d)+' · '+UZD[d.getDay()];
  if(d.getTime()>SEC.maxSeen){SEC.maxSeen=d.getTime();saveSec()}
  document.querySelectorAll('[data-since]').forEach(el=>el.textContent=dur(+el.dataset.since));
  document.querySelectorAll('[data-tk]').forEach(el=>{if(el.classList.contains('ready'))return;const m=mins(+el.dataset.tk);el.classList.toggle('warn',m>=10&&m<20);el.classList.toggle('late',m>=20)});
  if(UI.user&&S.settings.autoLock&&Date.now()-lastAct>S.settings.autoLock*60000)lockNow();
  recheck();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();toggleSheet(false)}});
window.addEventListener('storage',e=>{if(e.key===LS){load();if(UI.user){UI.user=staffById(UI.user.id)||null;if(UI.user)render();else route()}}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

loadSec();load();hydrate();
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
tick();route().then(()=>{if(serverMode())syncNow()});
setInterval(tick,10000);
setInterval(()=>syncNow(),60000);

</script>
