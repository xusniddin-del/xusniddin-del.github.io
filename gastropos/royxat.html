<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Restipay — ro‘yxatdan o‘tish</title>
<link rel="icon" href="icon-192.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e5e7eb;--soft:#f8fafc;--brand:#f97316;--brand2:#ea580c;--brandSoft:#fff7ed;--green:#10b981;--green2:#047857;--red2:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f4f6;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.hero{background:radial-gradient(500px 260px at 90% -20%,rgba(249,115,22,.35),transparent 60%),#0b1220;color:#fff;padding:22px 20px 56px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#fb923c,#ea580c);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(249,115,22,.7)}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.02em}.brand b span{color:#fb923c}
.hero h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:18px;line-height:1.2}
.hero p{font-size:13.5px;color:#94a3b8;margin-top:6px;line-height:1.5}
.gift{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(16,185,129,.15);color:#6ee7b7;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px}
.card{background:#fff;border-radius:22px;margin:-38px 12px 24px;padding:18px 16px 20px;box-shadow:0 20px 40px -20px rgba(15,23,42,.25);display:flex;flex-direction:column;gap:14px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;padding:0 14px;background:#fff;font-size:15px;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(249,115,22,.15)}
.ph{display:flex;align-items:center;border:1px solid var(--line);border-radius:13px;overflow:hidden;height:48px}
.ph:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(249,115,22,.15)}
.ph span{padding:0 4px 0 14px;font-weight:700;color:var(--muted)}.ph input{border:0;height:100%;flex:1;padding:0 12px 0 4px;outline:none;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plans button{border:1.5px solid var(--line);border-radius:14px;padding:10px 8px;text-align:left;background:#fff}
.plans button b{display:block;font-size:14px}.plans button small{display:block;font-size:12px;font-weight:800;color:var(--brand2);margin-top:2px}
.plans button i{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.plans button.on{border-color:var(--brand);background:var(--brandSoft);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.err{font-size:13px;color:var(--red2);font-weight:600;background:#fef2f2;border:1px solid #fecaca;padding:10px 12px;border-radius:12px}.err:empty{display:none}
.btn{height:54px;border-radius:15px;background:var(--brand);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 24px -10px rgba(249,115,22,.8)}
.btn[disabled]{opacity:.6}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ok{text-align:center;align-items:center}
.ok .big{width:76px;height:76px;border-radius:24px;background:#ecfdf5;color:var(--green2);display:grid;place-items:center;font-size:38px}
.ok h2{font-size:22px;font-weight:800}
.idbox{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:800;font-size:20px;letter-spacing:.04em}
.steps{text-align:left;display:flex;flex-direction:column;gap:10px;width:100%}
.steps div{display:flex;gap:10px;font-size:14px;line-height:1.5;color:var(--ink2)}
.steps b.n{width:26px;height:26px;border-radius:9px;background:var(--brandSoft);color:var(--brand2);display:grid;place-items:center;flex-shrink:0;font-size:13px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:0 20px 30px}
.foot a{color:var(--ink);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="hero">
  <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></div><b>Resti<span>pay</span></b></div>
  <h1>Kafengizni ro‘yxatdan o‘tkazing</h1>
  <p>Stollar, ofitsiantlar, oshxona cheki va hisobotlar — bitta dasturda.</p>
  <div class="gift">🎁 14 kun bepul · karta kerak emas</div>
</div>
<form class="card" id="f" onsubmit="send(event)" autocomplete="off"></form>
<div class="foot" id="foot"></div>

<script>
/* ⚙️ SOZLAMA — index.html dagi qiymatlar bilan bir xil bo‘lsin */
const CONFIG={
  SERVER_URL:'https://script.google.com/macros/s/AKfycbwZnlkvuG5D26na7hN4JrbK_81eDmTePh1qcQAdVXvtBU443HwT3OqkjfOPvjt8j4r4wQ/exec',
  APP_URL:'https://xusniddin-del.github.io/gastropos/',
  DEV_PHONE:'+998 90 832 44 36',
  PLANS:[{k:'Start',p:149000,d:'10 stol · 5 xodim'},{k:'Biznes',p:249000,d:'20 stol · Telegram hisobot'},{k:'Pro',p:399000,d:'30 stol · menyuni kiritamiz'}]
};
const TG=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData?Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#0b1220');TG.setBackgroundColor('#f3f4f6')}catch(e){}}
const U=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user||null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const normPhone=p=>String(p||'').replace(/\D/g,'').slice(-9);
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let plan='Start';
const tel=CONFIG.DEV_PHONE.replace(/\s/g,'');
$('foot').innerHTML=`Savollar bo‘yicha: <a href="tel:${tel}">${esc(CONFIG.DEV_PHONE)}</a>`;

function drawForm(){
  const v=n=>{const e=document.querySelector(`[name=${n}]`);return e?esc(e.value):''};
  const owner=v('owner')||esc(U?[U.first_name,U.last_name].filter(Boolean).join(' '):'');
  $('f').innerHTML=`
  <div><label>Kafe / restoran nomi</label><input class="inp" name="cafe" required maxlength="60" placeholder="Masalan: Rayhon milliy taomlari" value="${v('cafe')}"></div>
  <div><label>Egasining ismi</label><input class="inp" name="owner" required maxlength="50" placeholder="Ism Familiya" value="${owner}"></div>
  <div><label>Telefon raqam</label><div class="ph"><span>+998</span><input name="phone" type="tel" inputmode="tel" required placeholder="90 123 45 67" value="${v('phone')}"></div></div>
  <div class="two"><div><label>Shahar / tuman</label><input class="inp" name="city" required maxlength="40" placeholder="Marg‘ilon" value="${v('city')}"></div>
    <div><label>Stollar soni</label><input class="inp" name="tables" type="number" inputmode="numeric" min="1" max="30" required value="${v('tables')||10}"></div></div>
  <div><label>Tarif <span style="font-weight:500;color:var(--muted)">— 14 kun hammasi bepul</span></label>
    <div class="plans">${CONFIG.PLANS.map(p=>`<button type="button" class="${plan===p.k?'on':''}" onclick="plan='${p.k}';drawForm()"><b>${p.k}</b><small>${num(p.p)}</small><i>${esc(p.d)}</i></button>`).join('')}</div></div>
  <div><label>Admin PIN kod (4 raqam)</label>
    <div class="two"><input class="inp" name="pin" type="password" inputmode="numeric" maxlength="4" required placeholder="••••" value="${v('pin')}"><input class="inp" name="pin2" type="password" inputmode="numeric" maxlength="4" required placeholder="Takrorlang" value="${v('pin2')}"></div>
    <div class="hint" style="margin-top:6px">Kassa kompyuterida shu telefon va PIN bilan kirasiz. PIN’ni hech kimga aytmang.</div></div>
  <div class="err" id="err"></div>
  <button class="btn" id="go">Ro‘yxatdan o‘tish →</button>`;
}
drawForm();

async function send(e){
  e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target)),err=m=>{$('err').textContent=m;$('err').scrollIntoView({behavior:'smooth',block:'center'})};
  const ph=normPhone(f.phone);
  if(ph.length!==9)return err('Telefon raqamni to‘liq kiriting: 90 123 45 67');
  if(!/^\d{4}$/.test(f.pin))return err('PIN 4 ta raqamdan iborat bo‘lsin');
  if(f.pin!==f.pin2)return err('PIN kodlar mos emas');
  if(['0000','1111','1234','4321'].includes(f.pin))return err('Bu PIN juda oson. Boshqa 4 raqam tanlang');
  if(!CONFIG.SERVER_URL)return err('Server sozlanmagan');
  $('go').disabled=true;$('go').innerHTML='<span class="spin"></span> Yuborilmoqda...';$('err').textContent='';
  try{
    const r=await fetch(CONFIG.SERVER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'register',
      cafe:f.cafe.trim(),owner:f.owner.trim(),phone:'+998'+ph,city:f.city.trim(),tables:Math.max(1,Math.min(30,+f.tables||8)),plan,
      pinHash:await sha('gp|'+ph+'|'+f.pin),tg:U?String(U.id):'',version:'bot',device:'telegram'})});
    const j=await r.json();
    if(!j.ok){$('go').disabled=false;$('go').textContent='Ro‘yxatdan o‘tish →';return err(j.error||'Xatolik')}
    try{TG&&TG.HapticFeedback.notificationOccurred('success')}catch(_){}
    done(j.cid,'+998'+ph);
  }catch(x){$('go').disabled=false;$('go').textContent='Ro‘yxatdan o‘tish →';err('Internetni tekshiring va qayta urinib ko‘ring')}
}
function done(cid,phone){
  document.querySelector('.hero h1').textContent='Tabriklaymiz! 🎉';
  document.querySelector('.hero p').textContent='Kafengiz ro‘yxatdan o‘tdi. 14 kunlik bepul sinov boshlandi.';
  $('f').className='card ok';
  $('f').innerHTML=`<div class="big">✓</div><h2>Kafe ID</h2><div class="idbox">${esc(cid)}</div>
  <div class="steps">
    <div><b class="n">1</b><span>${TG?'Bot sizga <b>Restipay-kassa.bat</b> faylini yubordi — uni kassa kompyuteriga yuklab, ish stoliga qo‘ying.':'Kassa kompyuterida dasturni oching: <b>'+esc(CONFIG.APP_URL.replace('https://',''))+'</b>'}</span></div>
    <div><b class="n">2</b><span>Dasturni oching → <b>Kirish</b> → telefon <b>${esc(phone)}</b> va PIN kodingiz.</span></div>
    <div><b class="n">3</b><span>Menyu, xodimlar va stollarni kiriting — ishni boshlang!</span></div>
  </div>
  ${TG?'<button type="button" class="btn" style="width:100%" onclick="Telegram.WebApp.close()">Botga qaytish</button>':`<a class="btn" style="width:100%;text-decoration:none" href="${esc(CONFIG.APP_URL)}">Dasturni ochish</a>`}`;
  window.scrollTo(0,0);
}
</script>
</body>
</html>
